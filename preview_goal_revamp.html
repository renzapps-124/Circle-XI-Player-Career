<!doctype html>
<html><head><meta charset='utf-8'><title>Goal Revamp Preview</title><link rel='stylesheet' href='styles.css'>
<style>
body{margin:0;background:#050b18;font-family:Inter,Arial,sans-serif;color:#fff}
.preview-wrap{width:1200px;height:760px;margin:0 auto;background:linear-gradient(180deg,#071224,#050b18 16% 100%);padding:26px;box-sizing:border-box}
.header small{display:block;color:#94a3b8;font-weight:800;letter-spacing:.18em;font-size:12px;margin-bottom:8px}.header h1{margin:0 0 18px;font-size:44px}
.pitch{position:relative;height:610px;border-radius:24px;border:4px solid #d8b4fe;overflow:hidden;background:linear-gradient(180deg,#23834a 0%,#2a8d4f 6%,#247944 6.5%,#27884b 16%,#23834a 16.5%,#257e46 32%,#23834a 32.5%,#27884b 49%,#23834a 49.5%,#257e46 66%,#23834a 66.5%,#27884b 83%,#23834a 83.5%,#257e46 100%)}
.pitch:before{content:'';position:absolute;left:0;right:0;top:18px;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 2px,transparent 2px 28px);opacity:.8}
.pitch:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.12)}
.free-kick-ui{position:absolute;inset:0}
.training-panel{position:absolute;left:28px;top:26px;padding:14px 18px;border-radius:16px;background:linear-gradient(145deg,rgba(8,15,30,.95),rgba(11,23,38,.92));border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 38px rgba(0,0,0,.34)}
.training-panel h2{margin:0;font-size:32px}
.training-panel div{margin-top:8px;color:#fde68a;font-weight:700}
.wind-chip{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:rgba(8,15,30,.72);font-size:18px;font-weight:900;letter-spacing:.08em}
.goal-stage{position:absolute;inset:0}
</style></head>
<body>
<div class='preview-wrap'>
  <div class='header'><small>TRAINING GROUND</small><h1>Goal Graphic Revamp</h1></div>
  <div class='pitch'>
    <div class='free-kick-ui'>
      <div class='training-panel'><h2>Free Kick Technique</h2><div>Updated realistic 2D training goal</div></div>
      <div class='wind-chip'>WIND →</div>
      <div class='goal-stage'>
        <div class='full-training-goal match-net-goal free-kick-match-goal'>
          <span class='fk-goal-depth-shadow'></span>
          <span class='fk-goal-support fk-support-left'></span>
          <span class='fk-goal-support fk-support-right'></span>
          <span class='fk-net-back'></span>
          <span class='fk-net-roof'></span>
          <span class='fk-net-floor'></span>
          <span class='fk-net-side fk-net-left'></span>
          <span class='fk-net-side fk-net-right'></span>
          <span class='fk-net-impact-cell'></span>
          <span class='fk-net-ripple'></span>
        </div>
        <span class='fixed-goal-hoop hoop-left'></span>
        <span class='fixed-goal-hoop hoop-right'></span>
        <span class='fixed-goal-vest vest-left'></span>
        <span class='fixed-goal-vest vest-right'></span>
      </div>
    </div>
  </div>
</div>
</body></html>
